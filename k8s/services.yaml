apiVersion: v1
kind: Service
metadata:
  name: cybershield-mysql-svc
spec:
  selector:
    app: cybershield-mysql
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: cybershield-ai-svc
spec:
  selector:
    app: cybershield-ai
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: cybershield-backend-svc
spec:
  selector:
    app: cybershield-backend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cybershield-frontend-svc
spec:
  type: LoadBalancer
  selector:
    app: cybershield-frontend
  ports:
  - port: 80
    targetPort: 80
