version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cybershield-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cybershield_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: cybershield-ai-service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cybershield-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      AI_SERVICE_URL: http://ai-service:8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: cybershield_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cybershield-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
